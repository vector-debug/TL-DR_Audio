[project]
name = "interiit"
version = "0.1.0"
description = "Turns meeting recordings into refined transcripts, grounded minutes, decisions and action items."
readme = "README.md"
authors = [
    { name = "justcallyash", email = "s.yashvardhan@iitg.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cudnn-cu12>=9.0",
    "pyannote-audio>=4.0.7",
    "pydantic>=2.13.5",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "xhtml2pdf>=0.2.22",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
interiit = "interiit:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
